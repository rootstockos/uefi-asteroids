#
# Nothing Phone (3a), asteroids, SM7635
#

#
# Device Status
#
[status]
model_count = 1

#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs (inside the vendor's UEFI_FD region, as on giulia)
#
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs. Header v4, like the phone's own boot image: its bootloader does not start a header v1
# image. With v4 the initrd is vendor_boot ramdisk + payload + bootconfig; ShengBootMemoryDxe finds the payload
# FAT volume inside it.
#
[boot_image]
header_version = 4
os_version     = "17.0.0"
os_patch_level = "2026-08"
